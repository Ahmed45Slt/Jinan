<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق حفظ الأدعية للأطفال</title>
  <!-- تأكد من إضافة مكتبة Font Awesome في صفحة HTML -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
      font-family: 'Roboto', sans-serif; /* تم تغيير الخط إلى روبوتو */
      background-color: #d178f9cd; /* لون خلفية مشرق */
      text-align: center;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      padding: 20px;
    }

    header {
      background-color: #5a196b; /* لون مشرق وجذاب */
      padding: 20px 0;
      text-align: center;
      position: relative;
    }

    #playAudioButton {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #ffdc00;
      color: #14168d;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    
      /* يظهر فقط عند الحاجة */
    }

    #playAudioButton:hover {
      background-color: #0056b3;
    }

    /* حركة Flip للصورة */
    @keyframes flip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    header img {
      width: 100%;
      max-width: 200px;
      border-radius: 10px;
      animation: flip 9s linear infinite;
    }

    header h1 {
      font-size: 19px;
      color: #fff;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
    }

    .hadith-list {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      padding: 20px;
      flex-direction: column;
    }

    .hadith-list button {
      background-color: #32CD32;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.3s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 80%;
      max-width: 300px;
    }

    .hadith-list button:hover {
      background-color: #490d9c;
      transform: translateY(-5px);
    }

    .hadith-list button:active {
      transform: translateY(2px);
    }

    .hadith-list button:focus {
      outline: none;
      box-shadow: 0 0 10px 3px rgba(255, 99, 71, 0.7);
    }

    .video-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #d612128a;
      padding: 0px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.9);
      border-radius: 20px;
      z-index: 1000;
      text-align: center;
      max-width: 90%;
      width: 600px;
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .video-popup h2 {
      color: #ffffff;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .video-popup video {
      width: 100%;
      max-width: 100%;
      border-radius: 10px;
    }

    .video-popup button {
      margin-top: 20px;
      background-color: #9d1e08;
      color: white;
      border: none;
      padding: 8px 20px;
      cursor: pointer;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .video-popup button:hover {
      background-color: #FF4500;
    }

    @media screen and (max-width: 600px) {
      .sura-list {
        flex-direction: column;
        align-items: center;
      }

      .hadith-list button {
        width: 90%;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: ##342dd1;
        color: #fff;
      }

      header {
        background-color: ##100d53;
      }
    }

    .hadith-list button:nth-child(odd) {
      background-color: #32CD32;
    }

    .hadith-list button:nth-child(even) {
      background-color: #f07014;
    }
    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #ffdc00;
      color: #14168d;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .home-button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    main {
      padding: 20px;
    }
  </style>
</head>
<body>

<!-- باستخدام Font Awesome -->
<button id="playAudioButton">
  <i class="fas fa-volume-up"></i> 
</button>

<!-- نافذة الفيديو المنبثقة -->
<div class="video-popup" id="videoPopup" style="display: none;">
  <h2 id="videoTitle"></h2>
  <video id="videoPlayer" controls></video>
  <button onclick="closeVideo()">إغلاق</button>
</div>

<!-- صوت mp3 -->
<audio id="backgroundAudio" loop>
  <source src="https://dl.dropboxusercontent.com/scl/fi/tz6hpdka5hpng65yctplv/.mp3?rlkey=by0uiv0wrcslvl2y63db5scjq&st=gjk5tzj2&" type="audio/mp3">
  متصفحك لا يدعم تشغيل الصوت.
</audio>

<script>
  
    // وظيفة العودة للصفحة الرئيسية
    function goHome() {
      window.location.href = 'index.html'; // قم بتغيير 'index.html' إلى اسم الصفحة الرئيسية الخاصة بك
    }
  // تشغيل الصوت عند تفاعل المستخدم
  document.addEventListener('DOMContentLoaded', function () {
    var backgroundAudio = document.getElementById('backgroundAudio');
    var playAudioButton = document.getElementById('playAudioButton');

    // محاولة تشغيل الصوت تلقائيًا
    backgroundAudio.play().catch(function () {
      console.log('الصوت لم يتم تشغيله تلقائيًا بسبب قيود المتصفح.');

      // عرض زر لتشغيل الصوت يدويًا
      playAudioButton.style.display = 'block';
      playAudioButton.addEventListener('click', function () {
        backgroundAudio.play();
        playAudioButton.style.display = 'none'; // إخفاء الزر بعد التشغيل
      });
    });
  });

  // فتح الفيديو في نافذة منبثقة
  function openVideo(videoUrl, title) {
    var videoPlayer = document.getElementById('videoPlayer');
    var videoPopup = document.getElementById('videoPopup');
    var videoTitle = document.getElementById('videoTitle');
    var backgroundAudio = document.getElementById('backgroundAudio');

    // إيقاف الصوت
    backgroundAudio.pause();

    // تعيين رابط الفيديو واسم الفيديو
    videoPlayer.src = videoUrl;
    videoTitle.innerText = title;

    // عرض نافذة الفيديو المنبثقة
    videoPopup.style.display = 'block';
  }

  // إغلاق نافذة الفيديو
  function closeVideo() {
    var videoPopup = document.getElementById('videoPopup');
    var videoPlayer = document.getElementById('videoPlayer');
    var backgroundAudio = document.getElementById('backgroundAudio');

    // إخفاء نافذة الفيديو المنبثقة وإيقاف الفيديو
    videoPopup.style.display = 'none';
    videoPlayer.pause();
    videoPlayer.currentTime = 0;

    // إعادة تشغيل الصوت
    backgroundAudio.play();
  }
</script>
</body>
